# MongoDB configuration for preview environment
# Explicitly binds to 0.0.0.0 on port 5001 with logs in /var/lib/mongodb
storage:
  dbPath: /var/lib/mongodb
systemLog:
  destination: file
  path: /var/lib/mongodb/mongod.log
  logAppend: true
net:
  bindIp: 0.0.0.0
  port: 5001
processManagement:
  fork: false
