# Base MongoDB configuration for previews
# Binds to all interfaces on port 5001 so external health checks can reach it.
storage:
  dbPath: /var/lib/mongodb
systemLog:
  destination: file
  path: /var/lib/mongodb/mongod.log
  logAppend: true
net:
  bindIp: 0.0.0.0
  port: 5001
processManagement:
  fork: false
